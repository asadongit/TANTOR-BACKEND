events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://langfuse-web:3000;
            
            # 1. Remove the restrictive headers from Langfuse
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;

            # 2. Add our permissive headers to allow iframe embedding
            add_header Content-Security-Policy "default-src 'self' *; script-src 'self' 'unsafe-inline' 'unsafe-eval' *; style-src 'self' 'unsafe-inline' *; img-src * data: blob:; frame-ancestors * http://localhost:* http://127.0.0.1:* http: https:;" always;
            # We don't add X-Frame-Options at all, which defaults to allowing framing.

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
